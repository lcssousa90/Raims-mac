# ==============================================================================
# REIMS - macOS Tahoe Configuration
# Calibrado para: AMD Ryzen 5 5600X | NVIDIA GeForce RTX 3070 | SSD NVMe
# ==============================================================================

[vm]
name = macOS-Tahoe
os_version = tahoe
cores = 4
threads = 8
ram_gb = 10
vram_mb = 4096

[hardware]
cpu_model = Haswell-noTSX
cpu_vendor = GenuineIntel
cpu_flags = +invtsc,+hypervisor,+fma,+avx,+avx2
disk_size = 80G
disk_format = qcow2

[vgpu]
backend = vulkan
device = reims-graphics-pci
vulkan_icd = /usr/share/vulkan/icd.d/nvidia_icd.json
udmabuf_support = true

[boot]
boot_args = -v keepsyms=1 reims_vgpu=1 amfi=0x80 ipc_control_port_options=0
smbios = MacPro7,1

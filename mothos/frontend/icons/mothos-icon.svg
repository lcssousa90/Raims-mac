<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1b2646"/>
      <stop offset="55%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#060912"/>
    </radialGradient>
    <linearGradient id="wingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="wingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>
  <path d="M116 10 H396 Q502 10 502 116 V220 Q256 268 10 220 V116 Q10 10 116 10 Z" fill="url(#glass)"/>

  <!-- Moth Emblem -->
  <g filter="url(#glow)">
    <!-- Upper Left Wing -->
    <path d="M244 236 C210 156, 128 122, 88 158 C62 182, 80 250, 146 274 C186 288, 224 274, 244 258 Z" fill="url(#wingL)" fill-opacity="0.92"/>
    <!-- Upper Right Wing -->
    <path d="M268 236 C302 156, 384 122, 424 158 C450 182, 432 250, 366 274 C326 288, 288 274, 268 258 Z" fill="url(#wingR)" fill-opacity="0.92"/>
    <!-- Lower Left Wing -->
    <path d="M244 268 C210 282, 146 296, 134 344 C126 376, 166 396, 206 368 C228 352, 240 318, 246 288 Z" fill="url(#wingL)" fill-opacity="0.68"/>
    <!-- Lower Right Wing -->
    <path d="M268 268 C302 282, 366 296, 378 344 C386 376, 346 396, 306 368 C284 352, 272 318, 266 288 Z" fill="url(#wingR)" fill-opacity="0.68"/>
    <!-- Wing Eye Accents -->
    <circle cx="156" cy="206" r="14" fill="#070b14" fill-opacity="0.55"/>
    <circle cx="156" cy="206" r="6" fill="#7dd3fc"/>
    <circle cx="356" cy="206" r="14" fill="#070b14" fill-opacity="0.55"/>
    <circle cx="356" cy="206" r="6" fill="#7dd3fc"/>
    <!-- Body -->
    <ellipse cx="256" cy="268" rx="15" ry="62" fill="#f8fafc"/>
    <circle cx="256" cy="196" r="14" fill="#e0f2fe"/>
    <!-- Antennae -->
    <path d="M248 186 C236 156, 214 142, 198 140" fill="none" stroke="#bae6fd" stroke-width="6" stroke-linecap="round"/>
    <path d="M264 186 C276 156, 298 142, 314 140" fill="none" stroke="#bae6fd" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
